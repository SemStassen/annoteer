name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.20.0
        with:
          node-version: "24"
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm run pack
      - run: pnpm test:package
      - uses: actions/upload-artifact@v4
        with:
          name: annoteer-package
          path: artifacts/*.tgz
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-traces
          path: test-results/
